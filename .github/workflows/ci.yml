name: CI

on:
  push:
    branches: [master, main, 2.x, 'claude/**', 'fix/**', 'feat/**', 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish --no-check-lock
      - name: PHP syntax check
        run: find src config routes database tests tools -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer global require laravel/pint --no-interaction --no-progress
      - run: ~/.composer/vendor/bin/pint --test

  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '12.*'
            coverage: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
      - name: Pin the framework line
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
      # Laravel 11 stopped receiving security fixes in March 2026, so every 11.x release carries
      # advisories and Composer >= 2.10 refuses to install it. The package itself is not affected;
      # the block is lifted for this cell only, to keep testing the ^11 constraint the package still
      # declares. Whether to drop Laravel 11 in 4.0 is an open question for the owner.
      - name: Allow the end-of-life Laravel 11 line (advisories are the app's, not the package's)
        if: matrix.laravel == '11.*'
        run: composer config policy.advisories.block false
      - name: Install
        run: composer update --prefer-dist --no-progress --no-interaction
      - name: No private dependency is installed
        run: |
          if composer show lucipher/unite >/dev/null 2>&1; then echo "::error::lucipher/unite must not be a dependency"; exit 1; fi
          composer show --direct --name-only
      - name: Tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit
      - name: Tests with coverage
        if: ${{ matrix.coverage }}
        run: |
          mkdir -p build/coverage
          vendor/bin/phpunit --coverage-clover build/coverage/clover.xml --coverage-html build/coverage/html --coverage-text
          php tools/ci/coverage-floor.php build/coverage/clover.xml "$(cat .coverage-floor)"
      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage
          retention-days: 14

  larastan:
    name: Larastan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install
        run: composer update --prefer-dist --no-progress --no-interaction
      - name: Analyse
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
